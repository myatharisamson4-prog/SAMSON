name: Build SAMSON APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Fix on_audio_query Android manifest
        run: |
          sed -i 's/ package="com.lucasjosino.on_audio_query"//' /home/runner/.pub-cache/hosted/pub.dev/on_audio_query_android-1.1.0/android/src/main/AndroidManifest.xml

      - name: Fix on_audio_query Android namespace
        run: |
          python3 - <<'FIX'
          from pathlib import Path
          p = Path("/home/runner/.pub-cache/hosted/pub.dev/on_audio_query_android-1.1.0/android/build.gradle")
          s = p.read_text()
          if "namespace" not in s:
              s = s.replace("android {", 'android {\n    namespace "com.lucasjosino.on_audio_query_android"', 1)
              p.write_text(s)
          FIX

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAMSON-debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
